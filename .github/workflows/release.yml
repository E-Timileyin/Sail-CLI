name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  # Releasable means CI is green on the tagged commit. Without this, a tag pushed to a
  # broken commit produces a downloadable binary that does not work.
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      # The release job needs the validated tag, not a re-read of the raw input.
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the tag being released
        id: tag
        # workflow_dispatch takes a free-form string, so it is validated rather than
        # trusted: it is used as a checkout ref and as the version in release notes.
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a semver release tag of the form vX.Y.Z"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag '$tag' does not exist in this repository"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Refuse to republish an existing release
        # GoReleaser would otherwise fail late, after the build, or overwrite assets and
        # leave two releases claiming the same version.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag already exists. Delete it first, or cut a new tag."
            exit 1
          fi
          echo "No existing release for $tag"

      - name: Release metadata is coherent
        # Fails on a bad tag, an install URL that cannot resolve, or release-specific
        # wording in the permanent footer. Cheap, and runs before anything is published.
        run: ./scripts/check-release-coherence.sh "${{ steps.tag.outputs.tag }}" "$GITHUB_REPOSITORY"

      - name: GoReleaser config is valid
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

      - run: go build ./...
      - run: go test ./... -race -count=1

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the tag matches the module path
        # go install resolves a module path against the repository URL. If the two
        # disagree the release is installable only as a tarball, which is how v0.1.0
        # shipped an install command that could not work.
        run: |
          module=$(go list -m)
          echo "module path: $module"
          if [ "$module" != "github.com/E-Timileyin/Sail-CLI" ] && [ "$module" != "github.com/E-Timileyin/sail" ]; then
            echo "::warning::Module path '$module' does not match the repo URL. go install will not resolve."
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test the published archive
        # Downloads the artifact that was actually published and runs it. An earlier
        # version rebuilt from source and executed that instead, which proved nothing
        # about the archive: a corrupt tarball, a missing binary, or wrong archive
        # permissions would all have passed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.verify.outputs.tag }}"
          version="${tag#v}"
          platform="linux_amd64"
          archive="sail_${version}_${platform}.tar.gz"

          mkdir -p /tmp/smoke && cd /tmp/smoke
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern checksums.txt --clobber

          echo "== verifying checksum =="
          # Guard the empty case: if grep matches nothing, sha256sum reads no lines and
          # exits 0, so a missing entry would look like a pass.
          line="$(grep " $archive\$" checksums.txt || true)"
          if [ -z "$line" ]; then
            echo "::error::$archive is not listed in checksums.txt"
            exit 1
          fi
          printf '%s\n' "$line" | sha256sum --check --strict -

          echo "== extracting =="
          tar -xzf "$archive"
          test -x ./sail || { echo "::error::archive does not contain an executable 'sail'"; exit 1; }

          echo "== running the published binary =="
          ./sail --version
          ./sail --help >/dev/null

          # The version must match the tag, or users cannot tell which build they have.
          ./sail --version | head -1 | grep -qF "sail ${tag} " \
            || { echo "::error::sail --version does not report ${tag}"; ./sail --version; exit 1; }
          echo "published archive verified: $archive"
