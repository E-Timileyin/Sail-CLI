name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build ./...
      - name: go test
        run: go test ./... -race -count=1

  tidy:
    name: tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go.mod and go.sum must be tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            git diff -- go.mod go.sum
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The regression guard for the InsecureIgnoreHostKey fix, as its own job so a
      # failure is unambiguous rather than buried in the test output.
      - name: host-key verification guard
        run: |
          go test ./internal/sshx/ -v \
            -run 'TestNoInsecureIgnoreHostKey|TestAllClientConfigsVerifyHostKeys|TestHandshakeRejectsChangedHostKey'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Exit 3 means vulnerabilities were found, including ones unreachable from this
          # code. Only reachable ones fail the job: the rest are toolchain findings nobody
          # in this repo can act on, and failing on them leaves the gate permanently red.
          # Any other non-zero exit is a real failure (bad install, scan crash) and must
          # not be mistaken for a clean scan.
          set +e
          govulncheck ./... 2>&1 | tee /tmp/vuln.txt
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "::error::govulncheck failed to run (exit $status)."
            exit "$status"
          fi

          if grep -qE "^Your code is affected by [1-9]" /tmp/vuln.txt; then
            echo "::error::govulncheck found vulnerabilities reachable from this code."
            exit 1
          fi

          echo "No vulnerabilities reachable from this code."

  goreleaser-check:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

  # Single required check. Branch protection points here, so adding a job above does not
  # silently leave it unenforced.
  ci:
    name: ci
    if: always()
    needs: [test, tidy, lint, security, goreleaser-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "job results: $results"
          if echo "$results" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed."
